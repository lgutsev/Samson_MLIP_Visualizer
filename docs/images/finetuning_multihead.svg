<svg xmlns="http://www.w3.org/2000/svg" width="680" height="390" viewBox="0 0 680 390" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Multihead fine-tuning of MACE</title>
<desc>Two data sources, your DFT labels and Materials Project replay structures, both train one shared MACE body that keeps all 89 elements. The body feeds two readout heads: the Default head for your reaction, used by default, and pt_head, which keeps the Materials Project behaviour. Plain fine-tuning uses only the DFT labels and one head.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="390" fill="#FCFCFB"/>
<g font-size="14" text-anchor="middle" dominant-baseline="central">
<rect x="60" y="30" width="260" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="190" y="48" font-weight="500" fill="#712B13">Your DFT labels</text>
<text x="190" y="68" font-size="12" fill="#993C1D">87 HCN structures</text>
<rect x="360" y="30" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="490" y="48" font-weight="500" fill="#3C3489">Materials Project replay</text>
<text x="490" y="68" font-size="12" fill="#534AB7">500 to 10,000 structures</text>
<rect x="180" y="150" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="168" font-weight="500" fill="#2C2C2A">Shared MACE body</text>
<text x="340" y="188" font-size="12" fill="#5F5E5A">Foundation weights, all 89 elements</text>
<rect x="60" y="270" width="260" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="190" y="288" font-weight="500" fill="#712B13">Default head</text>
<text x="190" y="308" font-size="12" fill="#993C1D">Your reaction, used by default</text>
<rect x="360" y="270" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="490" y="288" font-weight="500" fill="#3C3489">pt_head</text>
<text x="490" y="308" font-size="12" fill="#534AB7">Keeps MP behaviour</text>
<text x="340" y="360" font-size="12" fill="#5F5E5A">Plain fine-tuning is the left side only: no replay, one head</text>
</g>
<g stroke="#5F5E5A" stroke-width="1.5" fill="none">
<line x1="210" y1="90" x2="276" y2="146" marker-end="url(#arrow)"/>
<line x1="470" y1="90" x2="404" y2="146" marker-end="url(#arrow)"/>
<line x1="276" y1="210" x2="210" y2="266" marker-end="url(#arrow)"/>
<line x1="404" y1="210" x2="470" y2="266" marker-end="url(#arrow)"/>
</g>
</svg>
