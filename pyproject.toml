[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samson-mlip-visualizer"
version = "0.1.0"
description = "Run MACE and DeepMD ASE calculators on structures in SAMSON"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Leonid Gutsev"}]
dependencies = ["ase>=3.23", "numpy>=1.24"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.scripts]
samson-mlip = "samson_mlip_visualizer.cli:main"
samson-remote = "samson_mlip_visualizer.remote.client:main"
samson-mcp = "samson_mlip_visualizer.remote.mcp_server:main"
samson-mlip-benchmark = "samson_mlip_visualizer.benchmark:main"

[project.optional-dependencies]
mace = ["mace-torch>=0.3"]
deepmd = ["deepmd-kit>=3.0"]
# P-RFO transition-state searches (TS search, QST refinement); pulls in jax.
ts = ["sella>=2.6"]
# Benchmark figures (samson-mlip-benchmark, the panel's Benchmark button).
plot = ["matplotlib>=3.7"]
test = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/lgutsev/Samson_MLIP_Visualizer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
